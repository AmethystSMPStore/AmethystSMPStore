<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmethystSMP Store - Ranks</title>
    <style>
        body {
            background-color: #0f0c1b;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #b19cd9;
            margin-top: 30px;
            font-size: 2.5rem;
            text-shadow: 0 0 15px rgba(177, 156, 217, 0.5);
        }

        p.subtitle {
            color: #a399bd;
            margin-bottom: 40px;
            font-size: 1.1rem;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 30px;
            padding: 10px 20px;
            background: #201535;
            border: 2px solid #52397d;
            color: #d1c4e9;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            border-color: #b19cd9;
            background: #2c1e48;
        }

        .ranks-container {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .rank-item {
            background: linear-gradient(135deg, #201535 0%, #130c22 100%);
            border: 2px solid #52397d;
            padding: 20px;
            border-radius: 12px;
            font-weight: bold;
            color: #ffffff;
            font-size: 1.2rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
        }

        .rank-item:hover {
            border-color: #b19cd9;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(177, 156, 217, 0.3);
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">⬅ Înapoi la Magazin</a>

    <h1>GRADE DISPONIBILE</h1>
    <p class="subtitle">Alege gradul preferat pentru AmethystSMP</p>
    
    <div class="ranks-container">
        <div class="rank-item">✨ Grad OG</div>
        <div class="rank-item">⭐ Grad Nova</div>
        <div class="rank-item">💜 Grad Amethyst</div>
        <div class="rank-item">⚔️ Grad CPVP</div>
    </div>

</body>
</html>
