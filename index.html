<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmethystSMP Store</title>
    <style>
        body {
            background-color: #0f0c1b;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #b19cd9;
            margin-top: 30px;
            font-size: 2.5rem;
            text-shadow: 0 0 15px rgba(177, 156, 217, 0.5);
        }

        p.subtitle {
            color: #a399bd;
            margin-bottom: 40px;
            font-size: 1.1rem;
        }

        .store-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            max-width: 900px;
            margin: 0 auto;
            padding: 10px;
        }

        .store-card {
            background: linear-gradient(135deg, #201535 0%, #130c22 100%);
            border: 2px solid #52397d;
            border-radius: 12px;
            padding: 30px 20px;
            color: #ffffff;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            text-decoration: none;
        }

        .store-card:hover {
            border-color: #b19cd9;
            background: linear-gradient(135deg, #2c1e48 0%, #18102b 100%);
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(177, 156, 217, 0.3);
        }

        .emoji {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .card-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: #d1c4e9;
        }

        /* Stiluri pentru meniul de grade care apare când apeși */
        .ranks-menu {
            display: none;
            margin-top: 40px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            background: rgba(32, 21, 53, 0.8);
            border: 2px solid #b19cd9;
            border-radius: 12px;
            padding: 20px;
        }

        .ranks-menu h2 {
            color: #d1c4e9;
            margin-top: 0;
        }

        .rank-item {
            background: #130c22;
            border: 1px solid #52397d;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            font-weight: bold;
            color: #ffffff;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <h1>AMETHYSTSMP STORE</h1>
    <p class="subtitle">Categorii disponibile în magazin</p>
    
    <div class="store-grid">
        <div class="store-card" onclick="toggleRanks()">
            <div class="emoji">👑</div>
            <div class="card-title">Ranks</div>
        </div>

        <div class="store-card">
            <div class="emoji">💎</div>
            <div class="card-title">Shards</div>
        </div>

        <div class="store-card">
            <div class="emoji">🔑</div>
            <div class="card-title">Key</div>
        </div>

        <div class="store-card">
            <div class="emoji">📦</div>
            <div class="card-title">Spawner</div>
        </div>
    </div>

    <div id="ranksSection" class="ranks-menu">
        <h2>Grade Disponibile</h2>
        <div class="rank-item">✨ Grad OG</div>
        <div class="rank-item">⭐ Grad Nova</div>
        <div class="rank-item">💜 Grad Amethyst</div>
        <div class="rank-item">⚔️ Grad CPVP</div>
    </div>

    <script>
        function toggleRanks() {
            var section = document.getElementById("ranksSection");
            if (section.style.display === "block") {
                section.style.display = "none";
            } else {
                section.style.display = "block";
            }
        }
    </script>

</body>
</html>
