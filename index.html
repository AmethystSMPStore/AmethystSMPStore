<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmethystSMP Store - Magazin Oficial</title>
    <style>
        /* ==========================================================================
           1. RESET & BAZĂ (CSS Modularizat)
           ========================================================================== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #05030a; 
            color: #ffffff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* ==========================================================================
           2. EFECTE VIZUALE INTERACTIVE (Aura/Glow)
           ========================================================================== */
        .glow-effect { 
            position: fixed; width: 400px; height: 400px; 
            background: radial-gradient(circle, rgba(138, 43, 226, 0.15) 0%, transparent 70%); 
            pointer-events: none; z-index: -1; transition: transform 0.1s ease; 
        }

        /* ==========================================================================
           3. HEADER & ANIMAȚII
           ========================================================================== */
        .header-container { display: flex; align-items: center; justify-content: center; gap: 25px; margin-top: 50px; margin-bottom: 20px; }
        .header-shard { font-size: 5rem; filter: drop-shadow(0 0 20px #ba55d3); animation: floatShard 4s ease-in-out infinite; }
        @keyframes floatShard { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        h1 { font-size: 4rem; text-shadow: 0 0 30px #8a2be2; letter-spacing: 5px; }

        /* ==========================================================================
           4. SECȚIUNI DE CONȚINUT (Extinse)
           ========================================================================== */
        .store-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 30px; margin-top: 40px; padding: 20px; }
        .store-card { 
            background: linear-gradient(145deg, #180f2e, #0d0818);
            border: 2px solid #8a2be2; border-radius: 25px; padding: 40px; 
            width: 200px; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            cursor: pointer; text-align: center;
        }
        .store-card:hover { transform: scale(1.15) rotate(1deg); box-shadow: 0 0 40px #8a2be2; }

        .page-section { display: none; padding: 50px; animation: fadeIn 0.8s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        /* ==========================================================================
           5. GRID PRODUSE & BUTOANE
           ========================================================================== */
        .items-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; max-width: 1200px; margin: 40px auto; }
        .item-card { background: #130c22; border: 2px solid #8a2be2; padding: 30px; border-radius: 20px; text-align: center; }
        .buy-btn { 
            background: linear-gradient(90deg, #8a2be2, #ff69b4); border: none; 
            color: white; padding: 15px 40px; border-radius: 30px; cursor: pointer; 
            font-weight: bold; margin-top: 20px; transition: 0.3s;
        }
        .buy-btn:hover { filter: brightness(1.2); transform: scale(1.05); }

        /* ==========================================================================
           6. MODAL PLĂȚI & LOGICĂ
           ========================================================================== */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #1c1135; padding: 50px; border-radius: 30px; border: 2px solid #8a2be2; width: 90%; max-width: 500px; }

        /* Se pot adăuga aici sute de linii de CSS pentru stări de hover, 
           culori specifice pentru fiecare grad (Gold, Blue, Pink), 
           stiluri pentru input-uri, scrollbar-uri personalizate, etc. */
    </style>
</head>
<body>
    <div class="glow-effect" id="glow"></div>

    <div class="header-container">
        <div class="header-shard">💎</div>
        <h1>AMETHYSTSMP</h1>
        <div class="header-shard">💎</div>
    </div>

    <!-- Meniu -->
    <div id="mainMenu" class="store-grid">
        <div class="store-card" onclick="showSection('ranksSection')">🛡️<br><br><b>GRADE</b></div>
        <div class="store-card" onclick="showSection('keysSection')">🔑<br><br><b>CHEI</b></div>
        <div class="store-card" onclick="showSection('shardsSection')">💎<br><br><b>SHARDS</b></div>
        <div class="store-card" onclick="showSection('spawnersSection')">📦<br><br><b>SPAWNERE</b></div>
        <div class="store-card" onclick="showSection('tagsSection')">🏷️<br><br><b>TAG-URI</b></div>
    </div>

    <!-- Secțiuni (Exemplu extins) -->
    <div id="ranksSection" class="page-section">
        <button class="buy-btn" onclick="showMain()">← ÎNAPOI</button>
        <h2>GRADE LEGENDARE</h2>
        <div class="items-grid">
            <!-- Peste 10 carduri de produse aici ar ocupa sute de linii -->
            <div class="item-card"><h3>GRAD OG</h3><p>Beneficii VIP nelimitate</p><button class="buy-btn" onclick="openModal()">CUMPĂRĂ</button></div>
            <div class="item-card"><h3>GRAD NOVA</h3><p>Beneficii avansate</p><button class="buy-btn" onclick="openModal()">CUMPĂRĂ</button></div>
        </div>
    </div>

    <!-- (Se pot replica secțiunile de mai sus pentru fiecare categorie: Chei, Shards, etc.) -->

    <script>
        // Logica pentru interactivitate
        document.addEventListener('mousemove', (e) => {
            const glow = document.getElementById('glow');
            glow.style.transform = `translate(${e.clientX - 200}px, ${e.clientY - 200}px)`;
        });

        function showSection(id) {
            document.getElementById('mainMenu').style.display = 'none';
            document.getElementById(id).style.display = 'block';
        }

        function showMain() {
            document.querySelectorAll('.page-section').forEach(s => s.style.display = 'none');
            document.getElementById('mainMenu').style.display = 'flex';
        }

        function openModal() {
            document.getElementById('checkoutModal').style.display = 'flex';
        }
    </script>

    <!-- Modal Final -->
    <div id="checkoutModal" class="modal-overlay" onclick="this.style.display='none'">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h2>Finalizare Comandă</h2>
            <p>Selectează metoda de plată...</p>
        </div>
    </div>
</body>
</html>
