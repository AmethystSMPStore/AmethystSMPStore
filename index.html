<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmethystSMP Store</title>
    <style>
        body {
            background-color: #0b0717;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        .header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            margin-top: 25px;
            margin-bottom: 10px;
            flex-wrap: wrap;
            position: relative;
        }

        .cart-icon-btn {
            background: linear-gradient(135deg, #1c1135 0%, #0d0818 100%);
            border: 2px solid #8a2be2;
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 15px rgba(138, 43, 226, 0.4);
            transition: 0.3s;
        }

        .cart-icon-btn:hover {
            border-color: #ff69b4;
            box-shadow: 0 0 20px rgba(255, 105, 180, 0.6);
            transform: scale(1.05);
        }

        .cart-badge {
            background: #ff69b4;
            color: white;
            padding: 2px 8px;
            border-radius: 50%;
            font-size: 0.85rem;
        }

        .header-shard {
            font-size: 4rem;
            filter: drop-shadow(0 0 20px rgba(186, 85, 211, 0.9));
            animation: floatShard 3s ease-in-out infinite;
        }

        .header-shard.right {
            animation-delay: 1.5s;
        }

        @keyframes floatShard {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.08); }
        }

        .header-titles {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #ffffff;
            margin: 0;
            font-size: 3.2rem;
            text-shadow: 0 0 25px rgba(177, 156, 217, 0.8), 0 0 15px rgba(138, 43, 226, 0.6);
            letter-spacing: 3px;
        }

        .header-subtitle {
            color: #d8bfd8;
            font-size: 1.2rem;
            margin-top: 8px;
            text-shadow: 0 0 12px rgba(216, 191, 216, 0.5);
            letter-spacing: 1px;
        }

        .server-intro-box {
            max-width: 800px;
            margin: 20px auto 10px auto;
            background: linear-gradient(135deg, #180f2e 0%, #0d0818 100%);
            border: 2px solid #8a2be2;
            border-radius: 16px;
            padding: 20px 30px;
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.3);
            line-height: 1.6;
            color: #dcdcdc;
            font-size: 1.05rem;
        }

        .server-intro-box b {
            color: #ffd700;
        }

        .server-ip-box {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, #1c1135 0%, #0d0818 100%);
            border: 2px solid #8a2be2;
            padding: 12px 30px;
            border-radius: 30px;
            margin: 20px 0 35px 0;
            box-shadow: 0 0 25px rgba(138, 43, 226, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .server-ip-box:hover {
            border-color: #ff69b4;
            box-shadow: 0 0 30px rgba(255, 105, 180, 0.7);
            transform: scale(1.03);
        }

        .ip-text {
            font-size: 1.3rem;
            font-weight: bold;
            color: #00ffff;
            letter-spacing: 1px;
        }

        .ip-copy-hint {
            font-size: 0.9rem;
            color: #aaa;
            background: #2b1b4d;
            padding: 5px 12px;
            border-radius: 15px;
            border: 1px solid #8a2be2;
        }

        .store-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 900px;
            margin: 10px auto 0 auto;
            padding: 10px;
        }

        .store-card {
            background: linear-gradient(135deg, #180f2e 0%, #0d0818 100%);
            border: 2px solid #8a2be2;
            border-radius: 16px;
            padding: 30px 20px;
            width: 160px;
            color: #ffffff;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(138, 43, 226, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .store-card:hover {
            border-color: #d8bfd8;
            transform: translateY(-5px);
            box-shadow: 0 0 25px rgba(216, 191, 216, 0.5);
        }

        .card-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffffff;
        }

        .page-section {
            display: none;
            margin-top: 20px;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background: #180f2e;
            border: 2px solid #8a2be2;
            color: #ffffff;
            text-decoration: none;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(138, 43, 226, 0.3);
        }

        .back-btn:hover {
            border-color: #d8bfd8;
            background: #251642;
        }

        .section-title {
            color: #ff69b4;
            font-size: 2rem;
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(255, 105, 180, 0.4);
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            max-width: 1100px;
            margin: 0 auto;
            padding: 10px;
        }

        .item-card {
            background: linear-gradient(135deg, #180f2e 0%, #0d0818 100%);
            border: 2px solid #8a2be2;
            border-radius: 16px;
            padding: 25px 15px;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(138, 43, 226, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .item-name { 
            font-size: 1.4rem; 
            font-weight: bold; 
            color: #ffd700; 
            margin-bottom: 15px; 
        }

        .item-desc {
            font-size: 0.95rem;
            color: #dcdcdc;
            line-height: 1.6;
            margin-bottom: 20px;
            min-height: 45px;
        }

        .item-price {
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 15px;
        }

        .tag-input-box {
            width: 80%;
            padding: 8px 12px;
            background: #130c22;
            border: 1px solid #8a2be2;
            color: white;
            border-radius: 8px;
            text-align: center;
            font-size: 1rem;
            margin-bottom: 15px;
            outline: none;
        }

        .tag-input-box:focus {
            border-color: #ff69b4;
            box-shadow: 0 0 8px rgba(255, 105, 180, 0.4);
        }

        .btn-container {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .buy-btn {
            background: linear-gradient(135deg, #8a2be2, #ba55d3);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(138, 43, 226, 0.5);
        }

        .buy-btn:hover, .cart-add-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(186, 85, 211, 0.8);
        }

        .cart-add-btn {
            background: linear-gradient(135deg, #2b1b4d, #4a2e80);
            border: 1px solid #8a2be2;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: linear-gradient(135deg, #1c1135 0%, #0d0818 100%);
            border: 2px solid #8a2be2;
            border-radius: 20px;
            padding: 25px;
            width: 90%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 0 30px rgba(138, 43, 226, 0.6);
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.5rem;
            color: #d8bfd8;
            cursor: pointer;
            background: none;
            border: none;
        }

        .modal-title {
            color: #ffd700;
            font-size: 1.5rem
